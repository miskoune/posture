<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Minimal fontconfig used only by scripts/make-og.mjs. The box has no
  /etc/fonts/fonts.conf, so without this sharp silently falls back to whatever
  grotesque it can find and the OG image stops matching the site.
-->
<fontconfig>
  <dir prefix="cwd">public/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
